name: Bug report
description: Create a report to help us improve (search for duplicates first)
labels: bug
body:
  - type: checkboxes
    attributes:
      label: Issue tracker rule checks (read carefully)
      options:
        - label: "I have checked that my problem <a href='https://github.com/TurtleManPurple/TurtlesAndMore/issues?q=is%3Aissue' target='_blank'>is not already reported</a>"
          required: true
        - label: "I have checked that I am using the latest version of the mod"
          required: true
  - type: textarea
    attributes:
      label: Issue description
      description: Explain clearly and unambiguously what went wrong
      placeholder: Tell us here about the bug/problem
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce this issue?
      description: Try to explain what you did for the bug to occur. A good explanation of steps to reproduce helps us locate the bug faster. If applicable, add screenshots to help explain your problem.
      placeholder: |
        Step 1: ...
        Step 2: ...
        ...
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Operating system
      description: Which operating system do you use?
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Loader
      description: Which mod loader do you use?
      options:
        - Fabric
        - NeoForge
        - Forge
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Game Version
      description: Which game version do you use?
      options:
        - 26.3
        - 1.21.8
        - 1.18.1
    validations:
      required: true
  - type: textarea
    attributes:
      label: Details
      description: To understand the issue, we need some details of your setup & system
      placeholder: |
        Minecraft Version: 1.21.1
        Loader Version: Fabric 0.16.9
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: |
        Paste your logs (full logs, do not crop them, in text format, screenshots of logs are not acceptable).
        
        Longer logs should be posted on [GitHub Gists](https://gist.github.com/) (or other paste service) and linked here.
      placeholder: https://gist.github.com/...
    validations:
      required: true
